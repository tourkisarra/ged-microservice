<div class="min-h-screen p-8 bg-gray-100">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow">
      <h1 class="text-3xl font-bold text-[#0D2538] mb-6">🔗 Partager un Document</h1>
  
      <div class="space-y-6">
        <p>Vous partagez le document ID : <strong>{{ documentId }}</strong></p>
  
        <div>
          <label class="block mb-2 text-gray-600">Choisir un utilisateur :</label>
          <select [(ngModel)]="selectedUser"
            class="w-full border px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-[#0D4955]">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let user of availableUsers" [value]="user">{{ user }}</option>
          </select>
        </div>
  
        <button (click)="share()" 
          class="w-full py-3 bg-[#0D4955] text-white rounded-lg hover:bg-[#0D2538] transition font-semibold">
          Partager
        </button>
      </div>
    </div>
  </div>
