<div class="flex min-h-screen bg-[#f8fafc]">
  <main class="flex-1 p-8 space-y-8">
    <h1 class="text-3xl font-bold text-[#0D4955] mb-6">Tableau de bord</h1>

    <!-- Cartes -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <h2 class="text-gray-500 text-sm">Documents</h2>
        <p class="text-3xl font-bold text-[#0D4955]">{{ documentCount }}</p>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <h2 class="text-gray-500 text-sm">Workspaces</h2>
        <p class="text-3xl font-bold text-[#0D4955]">{{ workspaceCount }}</p>
      </div>
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <h2 class="text-gray-500 text-sm">Favoris</h2>
        <p class="text-3xl font-bold text-[#0D4955]">{{ favoriteCount }}</p>
      </div>
    </div>

    <!-- Graphiques -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      

    </div>
  </main>
</div>
