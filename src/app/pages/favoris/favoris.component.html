<div class="flex overflow-hidden min-h-screen">

  <div class="flex-1 p-8 bg-gray-50 overflow-y-auto">
    <h2 class="text-2xl font-bold text-[#0D4955] mb-6">Documents Favoris</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div *ngFor="let doc of favoris" class="bg-white rounded-xl shadow hover:shadow-md p-5 relative transition">
        
        <!-- Type Badge -->
        <div class="absolute top-2 right-2 text-xs bg-[#0D4955] text-white px-2 py-0.5 rounded">
          {{ doc.type }}
        </div>

        <!-- Icone centrale -->
        <div class="flex items-center justify-center h-24 bg-gray-100 rounded mb-4">
          <i class="fas fa-file-alt text-[#0D4955] text-3xl" *ngIf="doc.type === 'Document'"></i>
          <i class="fas fa-image text-[#0D4955] text-3xl" *ngIf="doc.type === 'Image'"></i>
          <i class="fas fa-video text-[#0D4955] text-3xl" *ngIf="doc.type === 'Video'"></i>
          <i class="fas fa-file-archive text-[#0D4955] text-3xl" *ngIf="doc.type === 'Other'"></i>
        </div>

        <!-- Infos -->
        <h3 class="font-semibold text-[#0D4955] text-sm truncate">{{ doc.title }}</h3>
        <p class="text-xs text-gray-500 truncate">Ajouté le {{ doc.createdAt | date:'dd/MM/yyyy' }}</p>
        <p class="text-xs text-gray-500 truncate">Créateur : {{ doc.creator }}</p>

        <!-- Actions -->
        <div class="flex justify-between items-center mt-4 text-sm text-gray-600">
          <i class="fas fa-eye hover:text-[#0D4955] cursor-pointer" title="Consulter" (click)="viewDocument(doc)"></i>
          <i class="fas fa-download hover:text-green-700 cursor-pointer" title="Télécharger" (click)="downloadDocument(doc)"></i>
          
          <!-- Remplacé par cœur plein -->
          <i class="fas fa-heart text-red-500 hover:text-red-700 cursor-pointer" title="Retirer des favoris" (click)="removeFromFavorites(doc)"></i>
        </div>
      </div>
    </div>
  </div>
</div>
