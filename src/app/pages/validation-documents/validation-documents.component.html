<div class="p-8 bg-[#f8fafc] min-h-screen">
  <h1 class="text-3xl font-bold text-[#0D4955] mb-8">Validation des Documents</h1>

  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="w-full text-sm text-left">
      <thead class="bg-[#0D4955] text-white">
        <tr>
          <th class="px-6 py-3">Nom du Document</th>
          <th class="px-6 py-3">Type</th>
          <th class="px-6 py-3">Créateur</th>
          <th class="px-6 py-3">Date de Création</th>
          <th class="px-6 py-3">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let doc of documents" class="hover:bg-gray-50 transition">
          <td class="px-6 py-4 font-medium">{{ doc.name }}</td>
          <td class="px-6 py-4">{{ doc.type }}</td>
          <td class="px-6 py-4">{{ doc.creator }}</td>
          <td class="px-6 py-4">{{ doc.created | date: 'dd/MM/yyyy' }}</td>
          <td class="px-6 py-4 flex gap-4 items-center">
            <button (click)="acceptDocument(doc)" class="p-2 rounded-full  hover:bg-green-200 transition">
              <img src="assets/accept.png" alt="Accepter" class="w-6 h-6">
            </button>
            <button (click)="rejectDocument(doc)" class="p-2 rounded-full  hover:bg-red-200 transition">
              <img src="assets/rejeter.png" alt="Rejeter" class="w-6 h-6">
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
