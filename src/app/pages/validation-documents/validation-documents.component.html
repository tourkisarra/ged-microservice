<div class="flex h-screen overflow-hidden">
    <div class="flex-1 flex flex-col">
  
      <main class="flex-1 p-8 md:p-10 bg-gray-100 overflow-y-auto space-y-10">
        
        <!-- Titre -->
        <div class="flex justify-between items-center">
          <h1 class="text-3xl font-bold text-[#0D4955]">Validation des Documents</h1>
        </div>
  
        <!-- Tableau Documents -->
        <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead>
              <tr class="bg-gray-50 text-[#0D4955]">
                <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Document</th>
                <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Type</th>
                <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Soumis par</th>
                <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Date</th>
                <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Statut</th>
                <th class="px-6 py-3 text-center text-xs font-bold uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
              <tr *ngFor="let doc of documents">
                <td class="px-6 py-4 whitespace-nowrap">{{ doc.name }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ doc.type }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ doc.submittedBy }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ doc.date }}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <span [ngClass]="{
                    'text-yellow-500': doc.status === 'En attente',
                    'text-green-600': doc.status === 'Validé',
                    'text-red-600': doc.status === 'Rejeté'
                  }" class="font-semibold">{{ doc.status }}</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-center space-x-2">
                  <button *ngIf="doc.status === 'En attente'" (click)="openConfirmationModal(doc, 'validate')"
                    class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">
                    Valider
                  </button>
                  <button *ngIf="doc.status === 'En attente'" (click)="openConfirmationModal(doc, 'reject')"
                    class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded">
                    Rejeter
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
  
      </main>
  
      <!-- Modal de Confirmation -->
      <div *ngIf="isModalOpen" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
        <div class="bg-white rounded-xl p-8 shadow-lg max-w-md w-full">
          <h2 class="text-xl font-bold text-[#0D4955] mb-4">Confirmation</h2>
          <p class="text-gray-700 mb-6">
            Êtes-vous sûr de vouloir {{ actionType === 'validate' ? 'valider' : 'rejeter' }} le document
            <span class="font-semibold">{{ selectedDocument?.name }}</span> ?
          </p>
          <div class="flex justify-end space-x-4">
            <button (click)="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">
              Annuler
            </button>
            <button (click)="confirmAction()" [ngClass]="{
              'bg-green-600 hover:bg-green-700': actionType === 'validate',
              'bg-red-600 hover:bg-red-700': actionType === 'reject'
            }" class="px-4 py-2 text-white rounded font-semibold">
              Confirmer
            </button>
          </div>
        </div>
      </div>
  
    </div>
  </div>
