<div class="flex overflow-hidden min-h-screen">
  

  <!-- Main content -->
  <div class="flex-1 p-8 bg-gray-50 overflow-y-auto">
    <h2 class="text-2xl font-bold text-[#0D4955] mb-6">Statistiques & Suivi</h2>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- Documents par mois -->
      <div class="bg-white p-6 rounded-lg shadow h-[400px]">
        <h3 class="text-lg font-semibold text-[#0D4955] mb-4">Documents par mois</h3>
        <canvas baseChart
                [data]="lineChartData"
                [options]="lineChartOptions"
                [type]="'line'">
        </canvas>
      </div>

      <!-- Par type de document -->
      <div class="bg-white p-6 rounded-lg shadow h-[400px] flex flex-col items-center justify-center">
        <h3 class="text-lg font-semibold text-[#0D4955] mb-4">Par type de document</h3>
        <div class="w-[250px] h-[250px]">
          <canvas baseChart
                  [data]="doughnutChartData"
                  [type]="doughnutChartType"
                  [options]="doughnutChartOptions">
          </canvas>
        </div>
      </div>

      <!-- Consultations -->
      <div class="bg-white p-6 rounded-lg shadow h-[400px]">
        <h3 class="text-lg font-semibold text-[#0D4955] mb-4">Consultations</h3>
        <canvas baseChart
                [data]="barChartData"
                [options]="barChartOptions"
                [type]="'bar'">
        </canvas>
      </div>

      <!-- Utilisateurs actifs -->
      <div class="bg-white p-6 rounded-lg shadow h-[400px] flex flex-col items-center justify-center">
        <h3 class="text-lg font-semibold text-[#0D4955] mb-2">Utilisateurs actifs</h3>
        <p class="text-5xl font-bold text-[#0D4955]">{{ activeUsers }}</p>
      </div>

    </div>
  </div>
</div>
