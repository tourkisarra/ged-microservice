version: '3.8'

services:

  ########################
  # 1. PostgreSQL - GED
  ########################
  postgres-ged:
    image: postgres:15
    container_name: postgres-ged
    environment:
      POSTGRES_DB: ged
      POSTGRES_USER: geduser
      POSTGRES_PASSWORD: gedpass
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres-ged:/var/lib/postgresql/data
    networks:
      - ged-network

  ########################
  # 2. PostgreSQL - Keycloak
  ########################
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres-keycloak:/var/lib/postgresql/data
    networks:
      - ged-network

  ########################
  # 3. Keycloak
  ########################
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.0
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      - postgres-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8180:8080"
    networks:
      - ged-network
  ########################
  # 4. MinIO - Stockage
  ########################
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address :9001
    networks:
      - ged-network

  ########################
  # 5. Elasticsearch
  ########################
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9

    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - type: tmpfs
        target: /usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - ged-network


    ########################
    # 6. Kibana
    ########################
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:7.17.9
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - ged-network

    ########################
  # 7. pgAdmin (UI PostgreSQL)
  ########################
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: srrratourki@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-ged
      - postgres-keycloak
    networks:
      - ged-network
  ########################
  vault:
    image: hashicorp/vault:1.13.3
    container_name: vault-ged
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: vault server -dev

  ########################
  # 8. Nuxeo (Optionnel)
  ########################
  # nuxeo:
  #   image: nuxeo:LTS-2019
  #   container_name: nuxeo
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - NUXEO_DEV=true
  #     - NUXEO_ELASTICSEARCH_ENABLED=true
  #     - NUXEO_ELASTICSEARCH_ADDRESSLIST=elasticsearch:9200
  #   volumes:
  #     - ./data/nuxeo:/var/lib/nuxeo
  #   networks:
  #     - ged-network
  #   depends_on:
  #     - elasticsearch
  #     - postgres-ged

########################
# Réseaux et volumes
########################

volumes:
  esdata:

networks:
  ged-network:
    driver: bridge
